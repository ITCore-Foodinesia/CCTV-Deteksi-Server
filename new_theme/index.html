<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gudang Driver — Admin Panel (Theme Design System)</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Tailwind (CDN) — prototype only -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "Segoe UI", "Roboto", "Helvetica Neue", "Arial", "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"],
            },
            colors: {
              gd: {
                dark: "#1A2E35",
                primary: "#84CC16",
                primaryDark: "#4D7C0F",
                primaryLight: "#A3E635",
                accent: "#10B981",
                bg: "#F9FAFB",
              },
            },
          },
        },
      };
    </script>

    <style>
      :root {
        --gd-dark: #1A2E35;
        --gd-primary: #84CC16;
        --gd-primary-dark: #4D7C0F;
        --gd-primary-light: #A3E635;
        --gd-accent: #10B981;
        --gd-bg: #F9FAFB;
      }

      /* Small polish for smoother UX */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-hidden="true"] { display: none; }
    </style>
  </head>
  <body class="bg-[color:var(--gd-bg)] text-gray-900 font-sans antialiased">
    <div id="app" class="min-h-screen"></div>

    <div id="toast-root" class="fixed right-4 top-4 z-[100] flex flex-col gap-2"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
